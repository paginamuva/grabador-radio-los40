name: Grabador Automatico Los 40

on:
  schedule:
    # Lunes a viernes a las 6:00 AM hora de Colombia (11:00 UTC)
    - cron: '0 11 * * 1-5'
    # Viernes de 5:00 PM a 8:00 PM hora de Colombia (22:00 UTC)
    - cron: '0 22 * * 5'
  workflow_dispatch:

jobs:
  grabar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependencias (FFmpeg y rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: 4. Configurar credenciales de rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          [google drive]
          type = drive
          scope = drive
          token = {"access_token":"ya29.a0AehfTOnZA25WufLzlCN6eUMufANknoS1G0KedV0dfHfVgUVNoBaunw1NTFbNGlnUfJ7Nt4Gp58sUt53oZiSHDmkPVsRnnNDCqM54PGmUEmX79hSyLNWJejmsEdXNzsE_jEwtRX6UR6lMIYRht2EkJK4t9rYj-jXCYNAJC8f5AfkR9j6YCQgQLivX4zWGPJQfyosLlW0aCgYKAZwSARUSFQHGX2Mi4Ai6Cy4tdPJf8Mo_Wg40Xw0206","token_type":"Bearer","refresh_token":"1//05JLg4vTrr6WYCgYIARAAGAUSNwF-L9IrWDYC6oDIG3YGZxpZMkFq_hNbTb9890kuHKYHAb2VVkq6Lt-AvICuE0X3iDpUFbkA7IE","expiry":"2026-11-07T20:28:12.8455125-05:00","expires_in":3599}
          team_drive = 
          EOF

      - name: 5. Ejecutar script de grabación
        run: python grabar.py

      - name: 6. Subir archivo a Google Drive
        run: |
          rclone --config ~/.config/rclone/rclone.conf copy *.mp3 "google drive:GrabacionesRadio/" --progress
